[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "darkmagic"
version = "0.1.0"
description = "Differentiating through language-model training: MAGIC, SwapMagic, SteerMagic, CAFTMagic and MagicLens"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
dependencies = [
  "torch==2.11.0", "transformers==5.14.1", "peft==0.20.0",
  "huggingface-hub>=1.0", "safetensors>=0.5", "numpy>=2.0",
  "pyyaml>=6", "matplotlib>=3.9", "scikit-learn>=1.6", "scipy>=1.14", "httpx>=0.28",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]
figures = [
    "beautifulsoup4>=4.15.0",
    "playwright>=1.64.0",
]

[project.scripts]
darkmagic = "darkmagic.cli:main"

[tool.uv]
cache-dir = ".cache/uv"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires a CUDA device", "model: requires a cached model"]

[tool.ruff]
line-length = 100
